[project]
name = "ageledger"
version = "0.0.1"
description = "Open, cited, device-agnostic pace-of-aging ledger from consumer-wearable exports."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["ageledger*"]
